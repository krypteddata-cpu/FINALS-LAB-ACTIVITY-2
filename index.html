<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Class Record Manager</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Font for Chalk Style -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Kalam:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="chalkboard">
      <h2>Class Record Manager</h2>

      <!-- Display Main List & Count -->
      <p class="section-title">Students (<span id="arrayLength">0</span>):</p>
      <ul id="studentList"></ul>

      <hr class="chalk-line" />

      <!-- 1. Add Student (push) -->
      <div class="control-group">
        <input type="text" id="nameInput" placeholder="Enter student name" />
        <button onclick="handleAdd()">Add (push)</button>
      </div>

      <!-- 2. Remove Last (pop) -->
      <div class="control-group">
        <button onclick="handlePop()" class="btn-warning">
          Remove Last (pop)
        </button>
      </div>

      <!-- 3. Find by Index (at) -->
      <div class="control-group">
        <input
          type="number"
          id="indexInput"
          placeholder="Enter index (0, 1...)"
        />
        <button onclick="handleFindAt()">Find (at)</button>
      </div>

      <!-- 4. Join and toString -->
      <div class="control-group">
        <button onclick="handleJoin()">Join with " | "</button>
        <button onclick="handleToString()">Convert to String</button>
      </div>

      <hr class="chalk-line" />

      <!-- Output Area -->
      <div id="output" class="output-box">Result will appear here...</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
